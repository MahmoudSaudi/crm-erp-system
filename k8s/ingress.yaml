apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: crm-erp-ingress
  namespace: crm-erp
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: crm-erp.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: crm-app
                port:
                  number: 80
