apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: crm-erp
data:
  APP_NAME: "CRM ERP"
  APP_ENV: "local"
  APP_DEBUG: "true"
  APP_TIMEZONE: "Africa/Cairo"
  APP_URL: "http://localhost:8090"

  APP_LOCALE: "ar"
  APP_FALLBACK_LOCALE: "en"

  LOG_CHANNEL: "stack"
  LOG_LEVEL: "debug"

  DB_CONNECTION: "mysql"
  DB_HOST: "db"
  DB_PORT: "3306"
  DB_DATABASE: "crm_erp"

  SESSION_DRIVER: "database"
  CACHE_STORE: "database"
  QUEUE_CONNECTION: "database"

  FILESYSTEM_DISK: "local"

  MAIL_MAILER: "log"
  MAIL_FROM_ADDRESS: "hello@crm-erp.local"
