server {
    listen 80;
    server_name _;

    # Laravel بيخدم من public/ بس
    root /var/www/html/public;
    index index.php index.html;

    charset utf-8;
    client_max_body_size 20M;

    # Logs لـ stdout/stderr عشان docker logs
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # --------------------------------------------------------
    # المسار الرئيسي: أي request مش ملف حقيقي → index.php
    # --------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # --------------------------------------------------------
    # ملفات PHP → نحوّلها لـ PHP-FPM
    # --------------------------------------------------------
    location ~ \.php$ {
        # لو الملف مش موجود، 404 بدل ما نبعت لـ FPM
        try_files $uri =404;

        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;              # ← اسم service الـ PHP-FPM
        fastcgi_index index.php;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTP_PROXY "";

        # timeouts مناسبة للـ dev (production اقلّها)
        fastcgi_read_timeout 300;
    }

    # --------------------------------------------------------
    # Static assets → cache في المتصفح
    # --------------------------------------------------------
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot|map)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # --------------------------------------------------------
    # منع الوصول للملفات المخفية (.env, .git, ...)
    # لكن نسمح بـ .well-known (Let's Encrypt)
    # --------------------------------------------------------
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    # --------------------------------------------------------
    # تسكيت logs للملفات الشائعة اللي مش موجودة
    # --------------------------------------------------------
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # --------------------------------------------------------
    # حماية إضافية: منع تنفيذ PHP في مجلدات الـ uploads
    # --------------------------------------------------------
    location ~* /storage/.*\.php$ {
        deny all;
    }
}
