services:

  # ============================================================
  # 1. nginx — يستقبل HTTP ويحوّل PHP لـ app
  # ============================================================
  nginx:
    image: nginx:1.27-alpine
    container_name: crm-nginx
    restart: unless-stopped
#    user: "1000:1000"
    ports:
      - "8090:80"
    volumes:
      # الكود من الـ host (read-only للـ nginx)
      - type: bind
        source: ./
        target: /var/www/html
        read_only: true
      # build assets (named volume)
      - type: volume
        source: app_build
        target: /var/www/html/public/build
        read_only: true
      # ملف إعداداتنا
      - type: bind
        source: ./docker/nginx/default.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
    depends_on:
      - app
    networks:
      - crm-net

  # ============================================================
  # 2. app — PHP-FPM
  # ============================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: crm-erp:dev
    container_name: crm-app
    restart: unless-stopped
    working_dir: /var/www/html
    user: "1000:1000"
    volumes:
      # الكود من الـ host
      - type: bind
        source: ./
        target: /var/www/html
      # vendor (named volume — من الـ image)
      - type: volume
        source: app_vendor
        target: /var/www/html/vendor
      # build assets (named volume — من الـ image)
      - type: volume
        source: app_build
        target: /var/www/html/public/build
      # storage (named volume — persist)
#      - type: volume
#       source: app_storage
#      target: /var/www/html/storage
      # .env
      - type: bind
        source: ./.env.docker
        target: /var/www/html/.env
        read_only: true
    depends_on:
      db:
        condition: service_healthy
    networks:
      - crm-net

  # ============================================================
  # 3. db — MySQL 8.0
  # ============================================================
  db:
    image: mysql:8.0
    container_name: crm-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_secret_2026
      MYSQL_DATABASE: crm_erp
      MYSQL_USER: crm_user
      MYSQL_PASSWORD: crm_secret_2026
    volumes:
      - type: volume
        source: db_data
        target: /var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_secret_2026"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - crm-net

  # ============================================================
  # 4. phpmyadmin
  # ============================================================
  phpmyadmin:
    image: phpmyadmin:5-apache
    container_name: crm-phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: crm_user
      PMA_PASSWORD: crm_secret_2026
      UPLOAD_LIMIT: 64M
    depends_on:
      db:
        condition: service_healthy
    networks:
      - crm-net

networks:
  crm-net:
    driver: bridge

volumes:
  app_vendor:
  app_build:
#  app_storage:
  db_data:
